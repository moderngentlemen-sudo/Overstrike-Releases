# Checks hotfix.txt on every change, before players download it.
name: Check hotfix

on:
  push:
    paths: ["hotfix.txt", "tools/check_hotfix.py", ".github/workflows/check-hotfix.yml"]
  pull_request:
    paths: ["hotfix.txt", "tools/check_hotfix.py", ".github/workflows/check-hotfix.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_hotfix.py hotfix.txt
